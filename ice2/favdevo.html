
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>

    <main>
      <div class="content-box">
        <h2>Table of Favorites</h2>

        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>David A. Bednar</td>
            <td>Favorite Devotional 1</td>
            <td>BYU-Idaho</td>
            <td>2023</td>
          </tr>
          <tr>
            <td>Russell M. Nelson</td>
            <td>Favorite Devotional 2</td>
            <td>BYU</td>
            <td>2022</td>
          </tr>
          <tr>
            <td>Jeffrey R. Holland</td>
            <td>Favorite Devotional 3</td>
            <td>BYU</td>
            <td>2013</td>
          </tr>
        </table>

        <h2>Add Another Devotional</h2>

        <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" name="speaker">

          <label for="title">Title:</label>
          <input type="text" id="title" name="title">

          <label for="location">Location:</label>
          <input type="text" id="location" name="location">

          <label for="year">Year:</label>
          <input type="number" id="year" name="year">

          <button type="submit">Add Devotional</button>
        </form>

      </div>
    </main>
  </div>
</body>
</html>
